plugins:
    - 'rubocop-rake'

AllCops:
  NewCops: 'enable'
  TargetRubyVersion: 2.7
  Exclude:
    - 'spec/fixtures/**/*'
    - 'vendor/**/*'

Layout/LineLength:
  Max: 100
Metrics/MethodLength:
  CountComments: false
  Max: 20
Style/FrozenStringLiteralComment:
  Enabled: false
Layout/MultilineBlockLayout:
  Enabled: false

